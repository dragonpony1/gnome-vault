<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Gridiron & Glory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Chivo+Mono:wght@500;700&family=Grenze+Gotisch:wght@600;800&display=swap">
<style>
/* Layout: one-screen night game. Scoreboard, field strip, 3D dungeon arena with a 2D touch overlay, play cards. */
:root{
  color-scheme: dark;
  --night:#0b1712; --sideline:#0f241a; --turf:#17392a; --turf-2:#1b4231; --chalk:#eef2e6; --dim:#97ab9e;
  --torch:#f2a23a; --bulls:#d6533a; --wraith:#8fd8c8; --leather:#a8693a;
  --fur:#6b4329; --snout:#a07a5c; --horn:#f1e6c8; --robe:#2c4245; --hood:#152123;
  --good:#8cd894; --bad:#ff7461; --mana:#62b4ff; --gold:#f5c542; --line:rgba(238,242,230,.14); --faint:rgba(238,242,230,.26);
  --f-display:"Grenze Gotisch",Georgia,"Times New Roman",serif;
  --f-body:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-num:"Chivo Mono",ui-monospace,Menlo,Consolas,monospace;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--night);color:var(--chalk);font-family:var(--f-body);font-size:15px}
.app{display:flex;flex-direction:column;gap:10px;height:100%;max-width:540px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}

.board{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:end;flex:none}
.matchup{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.08;min-width:0}
.matchup span{display:block}
.matchup .bulls{color:var(--bulls)}
.matchup .wraiths{color:var(--wraith)}
.matchup em{font-style:normal;font-family:var(--f-num);font-weight:700;font-size:15px;color:var(--chalk);margin-left:6px}
.matchup .poss em::after{content:"";display:inline-block;width:10px;height:7px;border-radius:50%;background:var(--leather);box-shadow:0 0 0 1px var(--chalk);margin-left:7px;vertical-align:middle}
.matchup small{font-family:var(--f-body);font-weight:600;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.situ{text-align:right;font-family:var(--f-num);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.situ b{display:block;color:var(--chalk);font-size:19px;font-weight:700}
.mom{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}
.bar{flex:1;height:8px;border-radius:99px;background:var(--turf);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bulls),var(--torch));transition:width .4s}
.pct{font-family:var(--f-num);font-size:12px;color:var(--dim);min-width:4ch;text-align:right;font-variant-numeric:tabular-nums}

.strip{position:relative;height:30px;border-radius:8px;overflow:hidden;flex:none;border:1px solid var(--line);
  background:repeating-linear-gradient(90deg,var(--turf) 0 calc(100%/24),var(--turf-2) calc(100%/24) calc(100%/12))}
.ez{position:absolute;top:0;bottom:0;width:calc(100%/12)}
.ez.l{left:0;background:color-mix(in srgb,var(--bulls) 62%,var(--turf))}
.ez.r{right:0;background:color-mix(in srgb,var(--wraith) 38%,var(--turf))}
.tick{position:absolute;top:0;bottom:0;width:1px;background:var(--faint)}
.tick em{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);font-style:normal;font-family:var(--f-num);font-size:8px;color:var(--dim)}
.los,.ltg{position:absolute;top:0;bottom:0;transition:left .5s}
.los{width:2px;margin-left:-1px;background:var(--chalk)}
.ltg{width:3px;margin-left:-1.5px;background:var(--torch)}
.ball{position:absolute;top:36%;width:12px;height:8px;margin:-4px 0 0 -6px;border-radius:50%;background:var(--leather);box-shadow:0 0 0 2px var(--night);transition:left .5s}

.stage{position:relative;flex:1 1 auto;min-height:360px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--night)}
#gl,#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{pointer-events:none;outline:none}
#cv{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding:12px 14px;pointer-events:none}
.top{display:flex;flex-direction:column;gap:2px;text-shadow:0 1px 6px var(--night),0 0 2px var(--night)}
#ovTitle{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--torch)}
#ovHint{font-size:15px;font-weight:600;color:var(--chalk)}
.panel{margin-top:auto;pointer-events:auto;max-height:62%;overflow-y:auto;overscroll-behavior:contain;
  background:color-mix(in srgb,var(--night) 90%,transparent);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.call{margin:0;font-size:14px;line-height:1.35}
.call b{color:var(--wraith)}
.head{margin:0;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--chalk);text-wrap:balance}
.head.good{color:var(--torch)}
.head.bad{color:var(--bad)}
.flavor{margin:0;font-size:15px;line-height:1.35}
.small{font-size:13px;color:var(--dim)}
.how{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.3}
.how b{color:var(--torch)}
.rolls{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-family:var(--f-num);font-size:11.5px;line-height:1.45;color:var(--dim)}
.rolls li{padding-left:10px;border-left:3px solid var(--bad)}
.rolls li.ok{border-left-color:var(--good)}
.rolls b{color:var(--chalk)}
.note{margin:0;font-weight:600}
.note.good{color:var(--good)}
.note.wraith{color:var(--wraith)}
.end{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.end h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1;color:var(--torch)}
.end.loss h3{color:var(--bad)}
.end p{margin:0}
.again{align-self:flex-start;appearance:none;border:0;border-radius:10px;padding:10px 18px;background:var(--torch);color:var(--night);
  font:700 16px var(--f-body);cursor:pointer;touch-action:manipulation}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.again.alt{background:transparent;color:var(--chalk);border:1px solid var(--line)}
.again:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}

.cards{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;flex:none}
.card{appearance:none;display:flex;flex-direction:column;gap:3px;min-height:62px;padding:10px 8px;text-align:left;
  border:1px solid var(--line);border-radius:10px;background:var(--turf);color:var(--chalk);font:inherit;cursor:pointer;
  touch-action:manipulation;transition:transform .08s}
.card b{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1;color:var(--torch)}
.card small{font-size:12px;line-height:1.15;color:var(--dim)}
.card:active:not(:disabled){transform:scale(.96)}
.card:disabled{opacity:.42;cursor:default}
.card.rally b{color:var(--bulls)}
.card.rally.ready{background:color-mix(in srgb,var(--bulls) 42%,var(--turf));border-color:var(--bulls)}
.card.rally.ready b,.card.rally.ready small{color:var(--chalk)}
.card:focus-visible{outline:2px solid var(--torch);outline-offset:2px}

.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex:none;font-size:13px;color:var(--dim)}
.auto{display:flex;align-items:center;gap:6px}
.auto input{accent-color:var(--torch);width:16px;height:16px}
#stats{font-family:var(--f-num);font-size:12px;font-variant-numeric:tabular-nums}

/* RPG chrome */
.bars{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bars .mom{grid-column:auto;min-width:0}
.mana .bar i{background:linear-gradient(90deg,#3c4fd6,var(--mana))}
.panel{border-color:color-mix(in srgb,var(--torch) 38%,transparent);background:linear-gradient(180deg,color-mix(in srgb,#14201a 95%,transparent),color-mix(in srgb,var(--night) 95%,transparent));
  box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--night) 92%,transparent),inset 0 0 0 4px color-mix(in srgb,var(--torch) 16%,transparent),0 12px 30px rgba(0,0,0,.45)}
.card{background:linear-gradient(180deg,#1d3226,#122118);border-color:color-mix(in srgb,var(--torch) 30%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 4px 12px rgba(0,0,0,.35)}
.card:not(:disabled):hover{border-color:var(--torch)}
.spells{display:flex;gap:8px;overflow-x:auto;flex:none;min-height:40px;align-items:center;scrollbar-width:none}
.spells::-webkit-scrollbar{display:none}
.spell{display:flex;align-items:center;gap:7px;flex:none;padding:6px 12px 6px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
  background:color-mix(in srgb,var(--c) 10%,var(--night));color:var(--chalk);font:inherit;text-align:left;cursor:pointer;touch-action:manipulation}
.spell svg{width:18px;height:18px;fill:none;stroke:var(--c);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;flex:none}
.spell b{display:block;font-size:13px;line-height:1.05}
.spell small{display:block;font-size:11px;line-height:1.1;color:var(--dim)}
.spell.armed{background:color-mix(in srgb,var(--c) 28%,var(--night));box-shadow:0 0 0 1px var(--c),0 0 16px color-mix(in srgb,var(--c) 55%,transparent)}
.spell:disabled{opacity:.4;cursor:default}
.spell:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.reveal{flex:none;font-size:13px;font-weight:600;color:#d9c2ff;padding:6px 12px;border:1px dashed #9a6bff;border-radius:999px}
.coin{display:inline-block;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,var(--gold) 45%,#a8741a);box-shadow:0 0 0 1px #6b4a12;vertical-align:-1px;flex:none}
.shopbtn{appearance:none;display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);
  background:color-mix(in srgb,var(--gold) 12%,var(--night));color:var(--chalk);font:600 14px var(--f-body);cursor:pointer;touch-action:manipulation}
.shopbtn b{font-family:var(--f-num);font-size:13px}
.shopbtn:disabled{opacity:.45;cursor:default}
.shopbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.loot{margin:0;display:flex;align-items:center;gap:7px;font-weight:700;color:var(--gold)}
.shop{position:fixed;inset:0;z-index:30;display:flex;justify-content:center;background:rgba(2,6,4,.82);
  padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shop-in{width:100%;max-width:540px;display:flex;flex-direction:column;gap:12px;min-height:0;padding:16px;border-radius:14px;
  background:linear-gradient(180deg,#15211b,#0b130e);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);
  box-shadow:inset 0 0 0 4px var(--night),inset 0 0 0 5px color-mix(in srgb,var(--gold) 18%,transparent),0 20px 50px rgba(0,0,0,.6)}
.shop-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.shop-head h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1;color:var(--gold);text-wrap:balance}
.shop-head p{margin:5px 0 0;color:var(--dim);font-size:14px;line-height:1.3}
.purse{display:flex;align-items:center;gap:7px;flex:none;font-family:var(--f-num);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.purse .coin{width:16px;height:16px}
.shop-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.shop-group h3{margin:0 0 7px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.items{display:grid;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:center;padding:11px 12px;border-radius:10px;
  background:color-mix(in srgb,var(--c) 7%,var(--night));border:1px solid color-mix(in srgb,var(--c) 34%,transparent)}
.item>*{grid-column:1}
.item h4{margin:0;font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.05;color:var(--c)}
.item .tag{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c);opacity:.85}
.item p{margin:2px 0 0;font-size:13.5px;line-height:1.3}
.buy{grid-column:2;grid-row:1/span 3;appearance:none;border:0;border-radius:8px;padding:9px 12px;background:var(--gold);color:#1b1306;
  font:700 14px var(--f-num);display:flex;align-items:center;gap:6px;cursor:pointer;touch-action:manipulation}
.buy:disabled{background:transparent;color:var(--dim);border:1px solid var(--line);cursor:default}
.buy:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.item.owned{opacity:.7}
.shop-msg{margin:0;min-height:1.3em;font-size:14px;font-weight:600;color:var(--good)}
.shop-foot{display:flex;justify-content:space-between;align-items:center;gap:12px}

@media (prefers-reduced-motion: reduce){
  .los,.ltg,.ball,.bar i,.card{transition:none}
}
</style>

<div class="app">
  <header class="board">
    <div class="matchup"><span class="bulls">Labyrinth Bulls <em id="scB">0</em></span><span class="wraiths"><small>vs</small> Hollowmere Wraiths <em id="scW">0</em></span></div>
    <div class="situ"><b id="downTxt">1st &amp; 10</b><span id="spotTxt">Own 25</span></div>
    <div class="bars"><div class="mom"><span class="lbl">Rally</span><div class="bar"><i id="momFill"></i></div><span class="pct" id="momPct">0%</span></div><div class="mom mana"><span class="lbl">Mana</span><div class="bar"><i id="manaFill"></i></div><span class="pct" id="manaTxt">60</span></div></div>
  </header>

  <div class="strip" aria-hidden="true">
    <div class="ez l"></div>
    <div class="ez r"></div>
    <div id="ticks"></div>
    <div class="los" id="los"></div>
    <div class="ltg" id="ltg"></div>
    <div class="ball" id="ball"></div>
  </div>

  <section class="stage" id="stage" aria-label="Live 3D field. Tap, hold or swipe here during a play.">
    <canvas id="gl"></canvas>
    <canvas id="cv"></canvas>
    <div class="ov">
      <div class="top" aria-live="polite"><div id="ovTitle"></div><div id="ovHint"></div></div>
      <div class="panel" id="panel" aria-live="polite"><h2 class="head">Opening the arena…</h2><p class="flavor small">Loading the 3D engine.</p></div>
    </div>
  </section>

  <div class="spells" id="spells" aria-label="Spells to cast before the snap"></div>
  <div class="cards" id="cards"></div>

  <footer class="foot">
    <label class="auto" for="auto"><input type="checkbox" id="auto"> Auto mode (dice only)</label>
    <button class="shopbtn" id="shopBtn" type="button">Shop <i class="coin"></i><b id="goldTxt">0</b></button>
  </footer>

  <div class="shop" id="shop" hidden role="dialog" aria-modal="true" aria-labelledby="shopTitle">
    <div class="shop-in">
      <header class="shop-head">
        <div><h2 id="shopTitle">The Bone Market</h2><p>Spend the gold you win on drives. Everything you buy stays with your team.</p></div>
        <div class="purse"><i class="coin"></i><span id="shopGold">0</span></div>
      </header>
      <div class="shop-list" id="shopList"></div>
      <div class="shop-foot"><p class="shop-msg" id="shopMsg" aria-live="polite"></p><button class="again" id="shopClose" type="button">Back to the game</button></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.28.0/babylon.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
if (!window.BABYLON) {
  $('panel').innerHTML = '<h2 class="head bad">The 3D engine didn’t load</h2><p class="flavor">Check your connection and reload the page.</p>';
  return;
}
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage'), gl = $('gl');
let W = 0, H = 0;

const css = getComputedStyle(document.documentElement);
const C = {};
['torch','bulls','wraith','chalk','dim','good','bad','night','sideline','turf','turf-2','leather','fur','snout','horn','robe','hood','gold','mana']
  .forEach(k => C[k.replace('-', '')] = css.getPropertyValue('--' + k).trim());
const mix = (a, b, t) => '#' + [1, 3, 5].map(i => Math.round(parseInt(a.substr(i, 2), 16) * t + parseInt(b.substr(i, 2), 16) * (1 - t)).toString(16).padStart(2, '0')).join('');
const FD = css.getPropertyValue('--f-display').trim(), FB = css.getPropertyValue('--f-body').trim(), FN = css.getPropertyValue('--f-num').trim();

const d20 = () => 1 + Math.floor(Math.random() * 20);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const tri = x => { const p = x % 2; return p < 1 ? p : 2 - p; };
function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (_) {} }

const PLAYS = {
  run:   { name: 'Bull Run',    sub: 'Swipe to juke' },
  short: { name: 'Quick Slant', sub: 'Tap the catch' },
  deep:  { name: 'Deep Spell',  sub: 'Hold, beat the rush' },
  fg:    { name: 'Field Goal',  sub: 'Two taps' },
  rally: { name: 'Old Horns',   sub: 'Rally: auto 1st down' }
};
const DEFS = {
  stop:  { name: 'Bone Wall',   desc: 'a run stop' },
  zone:  { name: 'Fog Zone',    desc: 'deep zone coverage' },
  blitz: { name: 'Grave Blitz', desc: 'an all-out blitz' }
};
const MATCH = { run: { stop: -1, zone: 1, blitz: 0 }, short: { stop: 0, zone: -1, blitz: 1 }, deep: { stop: 1, zone: -1, blitz: 0 } };
const ORD = ['', '1st', '2nd', '3rd', '4th'];
const DIRS = ['left', 'right', 'up'];
const FIELD_W = 53.3, MID = 26.65, HASH_L = 23.6, HASH_R = 29.7;

const fresh = () => ({ ball: 25, bx: MID, down: 1, toGo: 10, mom: 0, fail: 0, plays: 0, yards: 0, perf: 0,
  fright: false, wraithRally: false, over: false, result: null, phase: 'choose', side: 'O', score: { B: 0, W: 0 }, mana: null, earn: 0, armed: null, reveal: null, nextDef: null, nextOff: null });
let S = fresh();
const addMom = v => { S.mom = clamp(S.mom + v, 0, 100); };

/* ================= team: gold, gear and spells that stay with you ================= */
const TEAM_KEY = 'gridiron-glory-team';
const teamDefault = () => ({ gold: 100, owned: {} });
let TEAM = teamDefault();
try { const t = JSON.parse(localStorage.getItem(TEAM_KEY) || 'null'); if (t && typeof t.gold === 'number') TEAM = Object.assign(teamDefault(), t); } catch (_) {}
let teamDoc = null, saving = false, saveAgain = false;
function persistLocal() { try { localStorage.setItem(TEAM_KEY, JSON.stringify(TEAM)); } catch (_) {} }
async function saveTeam() {
  persistLocal();
  if (!teamDoc) return;
  if (saving) { saveAgain = true; return; }
  saving = true;
  try { await teamDoc.set({ gold: TEAM.gold, owned: Object.assign({}, TEAM.owned) }); } catch (_) {}
  saving = false;
  if (saveAgain) { saveAgain = false; saveTeam(); }
}
async function connectStore() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const doc = db.collection('data/users/' + id).doc('gridiron-team');
    const snap = await doc.get();
    teamDoc = doc;
    if (snap.exists) {
      const d = snap.data();
      if (d && typeof d.gold === 'number') { TEAM = Object.assign(teamDefault(), { gold: d.gold, owned: Object.assign({}, d.owned || {}) }); persistLocal(); render(); }
    } else saveTeam();
  } catch (_) { teamDoc = null; }
}
const has = id => !!TEAM.owned[id];
const maxMana = () => 60 + (has('manawell') ? 40 : 0);
const rallyAt = () => has('oldhorn') ? 70 : 100;

function endHTML(kind) {
  const side = S.side, [h, t] = ENDS[side][kind] || ENDS[side].to, win = WIN[side].includes(kind);
  return `<div class="end ${win ? 'win' : 'loss'}"><h3>${h}</h3>` +
    `<p>${t} ${S.plays} play${S.plays === 1 ? '' : 's'}, ${S.yards} yards, ${S.perf} perfect input${S.perf === 1 ? '' : 's'}.</p>` +
    `<p class="small">Score: Bulls ${S.score.B}, Wraiths ${S.score.W}.</p>` +
    `<p class="loot"><i class="coin"></i>+${S.earn} gold \u00b7 ${TEAM.gold} in your purse</p>` +
    `<div class="btns"><button class="again" id="next" type="button">${side === 'O' ? 'Play defense' : 'Back to offense'}</button><button class="again alt" id="openShop2" type="button">Shop</button><button class="again alt" id="newgame" type="button">New game</button></div></div>`;
}
function endDrive(kind) {
  S.over = true; S.phase = 'over'; S.result = kind;
  const pts = kind === 'td' ? 7 : kind === 'fg' ? 3 : 0;
  if (pts) S.score[S.side === 'O' ? 'B' : 'W'] += pts;
  if (S.side === 'D' && kind === 'to') addMom(25);
  S.earn += ({ O: { td: 60, fg: 25 }, D: { to: 50, downs: 40, fgmiss: 20 } }[S.side][kind] || 0) + 3 * S.perf;
  TEAM.gold += S.earn; saveTeam();
  render(); addPanel(endHTML(kind));
  if (WIN[S.side].includes(kind)) { burst(); buzz([30, 50, 30, 50, 60]); }
}

/* ================= HUD outside the field ================= */
const pct = y => `${(10 + y) / 120 * 100}%`;
function buildTicks() {
  let h = '';
  for (let y = 10; y <= 90; y += 10) h += `<i class="tick" style="left:${pct(y)}"><em>${y <= 50 ? y : 100 - y}</em></i>`;
  $('ticks').innerHTML = h;
}
const spot = b => b >= 100 ? 'End zone' : b === 50 ? 'Midfield' : isD() ? (b < 50 ? `Wraiths ${b}` : `Bulls ${100 - b}`) : (b < 50 ? `Own ${b}` : `Wraiths ${100 - b}`);
const DCARDS = { stop: { name: 'Stampede', sub: 'Stop the run' }, zone: { name: 'Labyrinth', sub: 'Cover deep' }, blitz: { name: 'Horn Blitz', sub: 'Rush the QB' } };
const OFFNAME = { run: 'Ghost Run', short: 'Shade Slant', deep: 'Curse Bomb' };
function render() {
  const D = isD(), fp = y => D ? 100 - y : y;
  $('scB').textContent = S.score.B; $('scW').textContent = S.score.W;
  $('downTxt').textContent = S.over ? 'Final' : `${ORD[S.down]} & ${S.ball + S.toGo >= 100 ? 'Goal' : S.toGo}`;
  $('spotTxt').textContent = spot(S.ball);
  document.querySelector('.matchup .bulls').classList.toggle('poss', !D); document.querySelector('.matchup .wraiths').classList.toggle('poss', D);
  $('momFill').style.width = Math.min(100, S.mom / rallyAt() * 100) + '%';
  $('momPct').textContent = Math.round(Math.min(100, S.mom / rallyAt() * 100)) + '%';
  $('manaFill').style.width = (S.mana / maxMana() * 100) + '%'; $('manaTxt').textContent = Math.round(S.mana);
  $('goldTxt').textContent = TEAM.gold; $('shopBtn').disabled = S.phase === 'busy';
  $('ball').style.left = pct(fp(S.ball)); $('los').style.left = pct(fp(S.ball));
  $('ltg').style.left = pct(fp(Math.min(100, S.ball + S.toGo))); $('ltg').hidden = S.over;
  const busy = S.phase !== 'choose' || S.over;
  const avail = Object.keys(SPELLS).filter(k => known(k) && SPELLS[k].sides.includes(S.side));
  $('spells').innerHTML = avail.map(k => {
    const sp = SPELLS[k], armed = S.armed === k, ok = !busy && (armed || (S.mana >= sp.cost && !(k === 'foresight' && S.reveal)));
    return `<button class="spell${armed ? ' armed' : ''}" type="button" data-s="${k}" style="--c:${sp.color}" title="${sp.desc}" aria-pressed="${armed}"${ok ? '' : ' disabled'}>${RUNE[k]}<span><b>${sp.name}</b><small>${sp.cost} mana</small></span></button>`;
  }).join('') + (S.reveal ? `<span class="reveal">${S.reveal}</span>` : '');
  if (D) {
    $('cards').innerHTML = ['stop', 'zone', 'blitz'].map(k => `<button class="card" type="button" data-k="${k}"${busy ? ' disabled' : ''}><b>${DCARDS[k].name}</b><small>${DCARDS[k].sub}</small></button>`).join('');
    return;
  }
  const list = ['run', 'short', 'deep'], fgDist = 100 - S.ball + 17;
  if (S.down === 4 && fgDist <= 55 && !S.over) list.push('fg');
  list.push('rally');
  $('cards').innerHTML = list.map(k => {
    const p = PLAYS[k]; let sub = p.sub, dis = busy, cls = 'card';
    if (k === 'rally') { const ready = S.mom >= rallyAt(); dis = busy || !ready; cls += ready ? ' rally ready' : ' rally'; if (!ready) sub = `Rally at ${Math.round(Math.min(100, S.mom / rallyAt() * 100))}%`; }
    if (k === 'fg') sub = `${fgDist}-yard try`;
    return `<button class="${cls}" type="button" data-k="${k}"${dis ? ' disabled' : ''}><b>${p.name}</b><small>${sub}</small></button>`;
  }).join('');
}
$('cards').addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b && !b.disabled) (isD() ? runDefense : runPlay)(b.dataset.k); });
$('spells').addEventListener('click', e => { const b = e.target.closest('button[data-s]'); if (b && !b.disabled) castPre(b.dataset.s); });
function renderShop(msg) {
  $('shopGold').textContent = TEAM.gold;
  $('shopList').innerHTML = [['Gear', 'Gear'], ['Spell', 'Spell tomes'], ['Relic', 'Relics']].map(([kind, title]) =>
    `<section class="shop-group"><h3>${title}</h3><div class="items">${ITEMS.filter(i => i.kind === kind).map(i => {
      const own = has(i.id);
      return `<article class="item${own ? ' owned' : ''}" style="--c:${RARITY[i.rarity]}"><h4>${i.name}</h4><span class="tag">${i.rarity}</span><p>${i.desc}</p>` +
        `<button class="buy" type="button" data-buy="${i.id}"${own || TEAM.gold < i.cost ? ' disabled' : ''} aria-label="${own ? 'Owned' : `Buy ${i.name} for ${i.cost} gold`}">${own ? 'Owned' : `<i class="coin"></i>${i.cost}`}</button></article>`;
    }).join('')}</div></section>`).join('');
  $('shopMsg').textContent = msg || '';
}
function openShop() { if (S.phase === 'busy') return; renderShop(); $('shop').hidden = false; $('shopClose').focus(); }
function closeShop() { $('shop').hidden = true; render(); $('shopBtn').focus(); }
$('shopList').addEventListener('click', e => {
  const b = e.target.closest('[data-buy]'); if (!b || b.disabled) return;
  const it = ITEMS.find(i => i.id === b.dataset.buy); if (!it || has(it.id) || TEAM.gold < it.cost) return;
  TEAM.gold -= it.cost; TEAM.owned[it.id] = true;
  if (it.id === 'manawell') S.mana = Math.min(maxMana(), S.mana + 40);
  saveTeam(); buzz(25); renderShop(`${it.name} is yours.`); render();
});
$('shopBtn').addEventListener('click', openShop);
$('shopClose').addEventListener('click', closeShop);
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('shop').hidden) closeShop(); });

/* ================= boot ================= */
async function start(data) {
  if (data && data.S) { S = Object.assign(fresh(), data.S); if (S.phase === 'busy') S.phase = 'choose'; }
  if (S.mana == null) S.mana = maxMana();
  buildTicks(); render(); connectStore();
  try { await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]); } catch (_) {}
  buildArena();
  setup('run', 'zone', true);
  cam.x = S.bx; cam.y = S.ball + (isD() ? 4 : -3);
  new ResizeObserver(resize).observe(stage); resize();
  if (S.over) { setTop('', ''); showPanel(''); addPanel(endHTML(S.result)); }
  else if (S.plays === 0) (isD() ? introD : intro)();
  else { setTop('', ''); showPanel('<p class="flavor">Back in the huddle. Pick a play.</p>'); }
  last = performance.now();
  engine.runRenderLoop(frame);
  [6000, 12000].forEach(t => setTimeout(() => { if (!document.hidden && engine.getFps() < 28) lowFX(); }, t));
}
try { window.claude?.hot?.snapshot?.(() => ({ S })); } catch (_) {}
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
})();
</script>
