<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Gridiron & Glory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Chivo+Mono:wght@500;700&family=Grenze+Gotisch:wght@600;800&display=swap">
<style>
/* Layout: one-screen night game. Scoreboard, field strip, 3D dungeon arena with a 2D touch overlay, play cards. */
:root{
  color-scheme: dark;
  --night:#0b1712; --sideline:#0f241a; --turf:#17392a; --turf-2:#1b4231; --chalk:#eef2e6; --dim:#97ab9e;
  --torch:#f2a23a; --bulls:#d6533a; --wraith:#8fd8c8; --leather:#a8693a;
  --fur:#6b4329; --snout:#a07a5c; --horn:#f1e6c8; --robe:#2c4245; --hood:#152123;
  --good:#8cd894; --bad:#ff7461; --line:rgba(238,242,230,.14); --faint:rgba(238,242,230,.26);
  --f-display:"Grenze Gotisch",Georgia,"Times New Roman",serif;
  --f-body:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-num:"Chivo Mono",ui-monospace,Menlo,Consolas,monospace;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--night);color:var(--chalk);font-family:var(--f-body);font-size:15px}
.app{display:flex;flex-direction:column;gap:10px;height:100%;max-width:540px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}

.board{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:end;flex:none}
.matchup{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.05}
.matchup span{display:block}
.matchup .bulls{color:var(--bulls)}
.matchup .wraiths{color:var(--wraith)}
.matchup small{font-family:var(--f-body);font-weight:600;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.situ{text-align:right;font-family:var(--f-num);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.situ b{display:block;color:var(--chalk);font-size:19px;font-weight:700}
.mom{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}
.bar{flex:1;height:8px;border-radius:99px;background:var(--turf);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bulls),var(--torch));transition:width .4s}
.pct{font-family:var(--f-num);font-size:12px;color:var(--dim);min-width:4ch;text-align:right;font-variant-numeric:tabular-nums}

.strip{position:relative;height:30px;border-radius:8px;overflow:hidden;flex:none;border:1px solid var(--line);
  background:repeating-linear-gradient(90deg,var(--turf) 0 calc(100%/24),var(--turf-2) calc(100%/24) calc(100%/12))}
.ez{position:absolute;top:0;bottom:0;width:calc(100%/12)}
.ez.l{left:0;background:color-mix(in srgb,var(--bulls) 62%,var(--turf))}
.ez.r{right:0;background:color-mix(in srgb,var(--wraith) 38%,var(--turf))}
.tick{position:absolute;top:0;bottom:0;width:1px;background:var(--faint)}
.tick em{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);font-style:normal;font-family:var(--f-num);font-size:8px;color:var(--dim)}
.los,.ltg{position:absolute;top:0;bottom:0;transition:left .5s}
.los{width:2px;margin-left:-1px;background:var(--chalk)}
.ltg{width:3px;margin-left:-1.5px;background:var(--torch)}
.ball{position:absolute;top:36%;width:12px;height:8px;margin:-4px 0 0 -6px;border-radius:50%;background:var(--leather);box-shadow:0 0 0 2px var(--night);transition:left .5s}

.stage{position:relative;flex:1 1 auto;min-height:360px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--night)}
#gl,#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{pointer-events:none;outline:none}
#cv{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding:12px 14px;pointer-events:none}
.top{display:flex;flex-direction:column;gap:2px;text-shadow:0 1px 6px var(--night),0 0 2px var(--night)}
#ovTitle{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--torch)}
#ovHint{font-size:15px;font-weight:600;color:var(--chalk)}
.panel{margin-top:auto;pointer-events:auto;max-height:62%;overflow-y:auto;overscroll-behavior:contain;
  background:color-mix(in srgb,var(--night) 90%,transparent);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.call{margin:0;font-size:14px;line-height:1.35}
.call b{color:var(--wraith)}
.head{margin:0;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--chalk);text-wrap:balance}
.head.good{color:var(--torch)}
.head.bad{color:var(--bad)}
.flavor{margin:0;font-size:15px;line-height:1.35}
.small{font-size:13px;color:var(--dim)}
.how{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.3}
.how b{color:var(--torch)}
.rolls{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-family:var(--f-num);font-size:11.5px;line-height:1.45;color:var(--dim)}
.rolls li{padding-left:10px;border-left:3px solid var(--bad)}
.rolls li.ok{border-left-color:var(--good)}
.rolls b{color:var(--chalk)}
.note{margin:0;font-weight:600}
.note.good{color:var(--good)}
.note.wraith{color:var(--wraith)}
.end{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.end h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1;color:var(--torch)}
.end.loss h3{color:var(--bad)}
.end p{margin:0}
.again{align-self:flex-start;appearance:none;border:0;border-radius:10px;padding:10px 18px;background:var(--torch);color:var(--night);
  font:700 16px var(--f-body);cursor:pointer;touch-action:manipulation}
.again:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}

.cards{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;flex:none}
.card{appearance:none;display:flex;flex-direction:column;gap:3px;min-height:62px;padding:10px 8px;text-align:left;
  border:1px solid var(--line);border-radius:10px;background:var(--turf);color:var(--chalk);font:inherit;cursor:pointer;
  touch-action:manipulation;transition:transform .08s}
.card b{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1;color:var(--torch)}
.card small{font-size:12px;line-height:1.15;color:var(--dim)}
.card:active:not(:disabled){transform:scale(.96)}
.card:disabled{opacity:.42;cursor:default}
.card.rally b{color:var(--bulls)}
.card.rally.ready{background:color-mix(in srgb,var(--bulls) 42%,var(--turf));border-color:var(--bulls)}
.card.rally.ready b,.card.rally.ready small{color:var(--chalk)}
.card:focus-visible{outline:2px solid var(--torch);outline-offset:2px}

.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex:none;font-size:13px;color:var(--dim)}
.auto{display:flex;align-items:center;gap:6px}
.auto input{accent-color:var(--torch);width:16px;height:16px}
#stats{font-family:var(--f-num);font-size:12px;font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion: reduce){
  .los,.ltg,.ball,.bar i,.card{transition:none}
}
</style>

<div class="app">
  <header class="board">
    <div class="matchup"><span class="bulls">Labyrinth Bulls</span><span class="wraiths"><small>vs</small> Hollowmere Wraiths</span></div>
    <div class="situ"><b id="downTxt">1st &amp; 10</b><span id="spotTxt">Own 25</span></div>
    <div class="mom"><span class="lbl">Momentum</span><div class="bar"><i id="momFill"></i></div><span class="pct" id="momPct">0%</span></div>
  </header>

  <div class="strip" aria-hidden="true">
    <div class="ez l"></div>
    <div class="ez r"></div>
    <div id="ticks"></div>
    <div class="los" id="los"></div>
    <div class="ltg" id="ltg"></div>
    <div class="ball" id="ball"></div>
  </div>

  <section class="stage" id="stage" aria-label="Live 3D field. Tap, hold or swipe here during a play.">
    <canvas id="gl"></canvas>
    <canvas id="cv"></canvas>
    <div class="ov">
      <div class="top" aria-live="polite"><div id="ovTitle"></div><div id="ovHint"></div></div>
      <div class="panel" id="panel" aria-live="polite"><h2 class="head">Opening the arena…</h2><p class="flavor small">Loading the 3D engine.</p></div>
    </div>
  </section>

  <div class="cards" id="cards"></div>

  <footer class="foot">
    <label class="auto" for="auto"><input type="checkbox" id="auto"> Auto mode (dice only)</label>
    <span id="stats">Play 0 · 0 yds</span>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.28.0/babylon.js"></script>
<script>

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const C = {};

const d20 = () => 1 + Math.floor(Math.random() * 20);

const PLAYS = {
  run:   { name: 'Bull Run',    sub: 'Swipe to juke' },
  short: { name: 'Quick Slant', sub: 'Tap the catch' },
  deep:  { name: 'Deep Spell',  sub: 'Hold, beat the rush' },
  fg:    { name: 'Field Goal',  sub: 'Two taps' },
  rally: { name: 'Old Horns',   sub: 'Rally: auto 1st down' }
};
const DEFS = {
  stop:  { name: 'Bone Wall',   desc: 'a run stop' },
  zone:  { name: 'Fog Zone',    desc: 'deep zone coverage' },
  blitz: { name: 'Grave Blitz', desc: 'an all-out blitz' }

const MATCH = { run: { stop: -1, zone: 1, blitz: 0 }, short: { stop: 0, zone: -1, blitz: 1 }, deep: { stop: 1, zone: -1, blitz: 0 } };
const ORD = ['', '1st', '2nd', '3rd', '4th'];
const DIRS = ['left', 'right', 'up'];
const FIELD_W = 53.3, MID = 26.65, HASH_L = 23.6, HASH_R = 29.7;

const fresh = () => ({ ball: 25, bx: MID, down: 1, toGo: 10, mom: 0, fail: 0, plays: 0, yards: 0, perf: 0,
  fright: false, wraithRally: false, over: false, result: null, phase: 'choose' });
let S = fresh();
const addMom = v => { S.mom = clamp(S.mom + v, 0, 100); };

/* ================= simulation (yards: x across, y upfield) ================= */
let ents = [], play = null, mode = null, ts = 1, tsT = 1, chargeHeld = false;
const cam = { x: MID, y: 20, zy: 23 };
const ball = { x: MID, y: 25, h: 0, carrier: null, fl: null, spell: false };
const pops = [], fx = [];

const mk = (team, num, role, x, y, size) => ({ team, num, role, x, y, sx: x, sy: y, vx: 0, vy: 0, sp: 0,
  hd: team === 'W' ? -Math.PI / 2 : Math.PI / 2, size, state: 'up', ai: null, fall: 0, fly: null, lock: false });
const get = n => ents.find(e => e.num === n);
const up = e => e && e.state === 'up' && !e.fly;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function steer(e, tx, ty, speed) {
  const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);

}
const settle = e => { e.vx *= .85; e.vy *= .85; };
const chaseBall = (speed, lead = .3) => e => {
  const c = ball.carrier;
  if (c) steer(e, c.x + c.vx * lead, c.y + c.vy * lead, speed);

  else steer(e, ball.x, ball.y, speed);
};
const chaseAI = (speed, lead) => e => { const c = play && play.carrier; if (c) steer(e, c.x + c.vx * lead, c.y + c.vy * lead, speed); };
function knockDown(e, ang) { e.state = 'down'; e.fall = ang == null ? e.hd : ang; e.ai = null; e.lock = false; }

function spots(kind, def) {
  const c = S.bx, L = S.ball, out = [];
  const B = (n, r, dx, dy, s) => out.push(['B', n, r, c + dx, L + dy, s]);
  const D = (n, r, dx, dy, s) => out.push(['W', n, r, c + dx, L + dy, s]);
  B(72, 'OL', -2.4, -.7, 1.25); B(64, 'OL', -1.2, -.7, 1.25); B(55, 'OL', 0, -.6, 1.25); B(61, 'OL', 1.2, -.7, 1.25); B(77, 'OL', 2.4, -.7, 1.25);
  if (kind === 'fg') {
    B(85, 'TE', 3.7, -.9, 1.1); B(81, 'TE', -3.7, -.9, 1.1); B(34, 'RB', -1.5, -2.3, 1.1); B(88, 'RB', 1.5, -2.3, 1.1);
    B(7, 'H', 0, -7, 1); B(3, 'K', -1.6, -9.6, 1);
    [[90, -1], [99, 1], [93, -3], [96, 3], [57, -5], [52, 5], [50, 0], [21, -7], [24, 7], [31, -2], [33, 2]]
      .forEach(([n, dx], i) => D(n, 'DL', dx, i < 9 ? 1.1 : 3, 1.1));
    return out;
  }
  B(85, 'TE', 3.7, -.9, 1.1); B(7, 'QB', 0, -4, 1);
  if (kind === 'run') B(34, 'RB', 0, -6, 1.1); else B(34, 'RB', -1.4, -4.3, 1.1);
  B(81, 'WR', -13, -.8, .95); B(88, 'WR', 12, -.8, .95); B(11, 'WR', -8, -1.3, .95);
  const lbY = def === 'stop' ? 3.4 : def === 'blitz' ? 2.3 : 4.6, cbY = def === 'blitz' ? 2.6 : def === 'zone' ? 8 : 6, sY = def === 'zone' ? 15 : def === 'stop' ? 9 : 12;
  D(90, 'DL', -3.1, 1.1, 1.2); D(99, 'DL', -1, 1.1, 1.2); D(93, 'DL', 1, 1.1, 1.2); D(96, 'DL', 3.1, 1.1, 1.2);
  D(57, 'LB', def === 'blitz' ? -2.2 : -4, lbY, 1.05); D(52, 'LB', 0, lbY + .3, 1.05); D(50, 'LB', def === 'blitz' ? 2.2 : 4, lbY, 1.05);
  D(21, 'CB', -13, cbY, .95); D(24, 'CB', 12, cbY, .95); D(31, 'S', -6, sY, 1); D(33, 'S', 6, sY, 1);

}
function setup(kind, def, instant) {
  const old = new Map(ents.map(e => [e.num, e]));
  ents = spots(kind, def).map(([t, n, r, x, y, s]) => {
    const e = mk(t, n, r, x, y, s), o = old.get(n);
    if (o && !instant && o.team !== 'M') { e.x = o.x; e.y = o.y; e.ai = gotoSpot; }
    return e;
  });
  ball.carrier = null; ball.fl = null; ball.spell = false;
  ball.x = S.bx; ball.y = S.ball - .6; ball.h = 0;
}
function gotoSpot(e) {
  if (steer(e, e.sx, e.sy, 12) < .06) { e.ai = null; e.vx = e.vy = 0; e.hd = e.team === 'W' ? -Math.PI / 2 : Math.PI / 2; }
}
function lineUp() {
  return new Promise(res => {
    const t0 = performance.now();
    const chk = () => {
      if (ents.every(e => !e.ai) || performance.now() - t0 > 1100) {
        ents.forEach(e => { e.x = e.sx; e.y = e.sy; e.ai = null; e.vx = e.vy = 0; e.hd = e.team === 'W' ? -Math.PI / 2 : Math.PI / 2; });

    };
    chk();
  });

function stepEnt(e, dt) {

  if (play && !play.closed && play.focus) return play.focus();

/* ================= 3D arena (Babylon.js) ================= */
const B = BABYLON, V3 = B.Vector3, C3 = B.Color3, MB = B.MeshBuilder;

let engine;

engine.setHardwareScalingLevel(1 / Math.min(window.devicePixelRatio || 1, 2));
const scene = new B.Scene(engine);
const nightC = col('#060d0a');
scene.clearColor = new B.Color4(nightC.r, nightC.g, nightC.b, 1);

scene.skipPointerMovePicking = true;
const camera = new B.UniversalCamera('cam', new V3(0, 9, 10), scene);
camera.fovMode = B.Camera.FOVMODE_HORIZONTAL_FIXED; camera.fov = 1.12; camera.minZ = .2; camera.maxZ = 260; camera.inputs.clear();
const hemi = new B.HemisphericLight('hemi', new V3(.2, 1, -.3), scene);
hemi.intensity = .55; hemi.diffuse = col('#b4c6d2'); hemi.groundColor = col('#1d2a24'); hemi.specular = C3.Black();
const lantern = new B.PointLight('lantern', new V3(0, 12, 0), scene);
lantern.diffuse = col('#ffe7c2'); lantern.specular = C3.Black(); lantern.intensity = .75; lantern.range = 34;
const torchLights = [0, 1, 2, 3].map(i => { const l = new B.PointLight('tl' + i, V3.Zero(), scene); l.diffuse = col(C.torch); l.specular = C3.Black(); l.range = 17; l.intensity = 1.1; return l; });
const glow = new B.GlowLayer('glow', scene, { mainTextureSamples: 1, blurKernelSize: 32 });
glow.intensity = .75;

const mat = (name, hex, o = {}) => {

      rb.ai = settle;
      P.finish({ y, td, x: rb.x, kind: 'good', head: td ? 'Touchdown!' : 'Bull rush!',
        text: `The Bulls’ giant bull mascot thunders out of the gate and clears a path. ${y} yards${td ? ' and into the end zone' : ' and a first down'}.` }, .9);
    }
  };
  return P;
}

/* ================= flow ================= */
const panel = $('panel');
function showPanel(html) { panel.innerHTML = html; panel.hidden = false; panel.scrollTop = 0; }
function addPanel(html) { panel.insertAdjacentHTML('beforeend', html); panel.scrollTop = panel.scrollHeight; }
panel.addEventListener('click', e => { if (e.target.closest('#again')) reset(); });
const modsTxt = mods => mods.filter(m => m[1]).map(([n, v]) => ` ${v < 0 ? '−' : '+'} ${Math.abs(v)} ${n}`).join('');

function showSummary(P, out) {
  setTop('', '');
  const advTxt = r => r.adv ? ` (${r.a} & ${r.b}, kept ${r.adv > 0 ? 'higher' : 'lower'})` : '';
  const lines = P.rolls.map(r => `<li class="${r.ok ? 'ok' : ''}"><b>${r.label}</b>: d20 ${r.nat}${advTxt(r)} + ${r.base[0]} ${r.base[1]}${modsTxt(r.mods)} = <b>${r.total}</b> vs ${r.dc}${r.crit ? ', crit' : ''}</li>`).join('');
  const call = P.def ? `<p class="call">Wraiths called <b>${DEFS[P.def].name}</b>, ${DEFS[P.def].desc}. ${P.match > 0 ? 'Good matchup for you.' : P.match < 0 ? 'They read it.' : 'Even matchup.'}${P.adv > 0 ? ' Rolls at advantage.' : P.adv < 0 ? ' Rolls at disadvantage.' : ''}${P.snapQ && P.snapQ !== 'auto' ? ` Snap: ${P.snapQ}.` : ''}</p>` : '';
  showPanel(`<h2 class="head ${out.kind || ''}">${out.head}</h2><p class="flavor">${out.text}</p>${call}${lines ? `<ul class="rolls">${lines}</ul>` : ''}`);
}

function intro() {
  setTop('', '');
  showPanel(`<h2 class="head">Bulls ball, own 25</h2>
    <p class="flavor">Score on this drive in the Wraiths’ dungeon arena. Pick a play, tap the snap, then play it live.</p>
    <ul class="how">
      <li><b>Bull Run</b> When a Wraith closes in, the action slows. Swipe the arrow to juke him.</li>
      <li><b>Quick Slant</b> Tap as the ball reaches your receiver and the rings line up.</li>
      <li><b>Deep Spell</b> Hold to charge, release in the gold before the rusher reaches your QB.</li>
    </ul>
    <p class="flavor small">Every touch moment rolls a d20 on the spot. Your timing is the bonus.</p>`);
}

function pickDefense() {
  const w = { stop: 1, zone: 1, blitz: .8 };
  if (S.toGo <= 3) w.stop += 1.2;
  if (S.toGo >= 8) w.zone += .8;
  if (S.down >= 3) w.blitz += .6;
  if (100 - S.ball <= 10) w.stop += .5;
  let t = Math.random() * (w.stop + w.zone + w.blitz);
  for (const k of ['stop', 'zone', 'blitz']) { t -= w[k]; if (t <= 0) return k; }
  return 'blitz';
}

async function runPlay(type) {
  if (S.phase !== 'choose' || S.over) return;
  S.phase = 'busy'; panel.hidden = true; play = null; render();
  const auto = $('auto').checked;
  if (type === 'rally') {
    S.mom = 0; render();
    setup('run', 'zone'); await lineUp();
    const P = makeRally(); play = P; P.begin();
    const out = await P.done;
    showSummary(P, out); if (out.x != null) S.bx = clamp(out.x, HASH_L, HASH_R);
    apply(out, true); return;
  }
  if (type === 'fg') {
    const dist = 100 - S.ball + 17, mods = [];
    setup('fg', null); await lineUp();
    if (!auto) {
      const pw = await meter({ title: 'Kick: power', hint: 'Tap in the green for power', green: .22, perfect: .06, speed: 1.2, timeout: 4000 });
      const am = await meter({ title: 'Kick: aim', hint: 'Tap in the green to aim', green: .16, perfect: .05, speed: 1.6, timeout: 4000 });
      [[pw, 'power'], [am, 'aim']].forEach(([r, n]) => {
        mods.push([`${r.q === 'perfect' ? 'perfect ' : r.q === 'miss' ? 'bad ' : ''}${n}`, { perfect: 3, good: 1, miss: -3 }[r.q]]);
        if (r.q === 'perfect') S.perf++;
      });
    }
    setTop('', '');
    const P = makeFG(mods, dist); play = P; P.begin();
    const out = await P.done;
    showSummary(P, out); S.plays++; endDrive(out.fg ? 'fg' : 'fgmiss'); return;
  }
  const def = pickDefense();
  setup(type, def); await lineUp();
  const fr = S.fright; S.fright = false;
  let q = 'auto';
  if (!auto) q = (await meter({ title: fr ? 'Snap, frightened' : 'Snap',
    hint: fr ? 'Nobody’s fright shrank the green. Tap inside it.' : 'Tap when the needle hits the green',
    green: fr ? .12 : .22, perfect: fr ? .035 : .06, speed: 1.05 })).q;
  setTop('', '');
  const P = (type === 'run' ? makeRun : type === 'short' ? makeShort : makeDeep)(def);
  applySnap(P, q);
  play = P; P.begin();
  popAt(S.bx, S.ball + 9, DEFS[def].name.toUpperCase(), MATCH[type][def] > 0 ? 'your play beats it' : MATCH[type][def] < 0 ? 'they read it' : 'even matchup', C.wraith);
  const out = await P.done;
  showSummary(P, out);
  if (out.x != null) S.bx = clamp(out.x, HASH_L, HASH_R);
  apply(out, false);
}

function apply(out, noMom) {
  S.plays++;
  if (out.to) { endDrive('to'); return; }
  S.ball += out.y; S.yards += out.y;
  if (out.td || S.ball >= 100) { S.ball = 100; endDrive('td'); return; }
  S.ball = Math.max(1, S.ball);
  if (out.y > 0) { S.fail = 0; if (!noMom) addMom(out.y * 2); } else S.fail++;
  const notes = [];
  if (out.y >= S.toGo) {
    S.down = 1; S.toGo = Math.min(10, 100 - S.ball);
    if (!noMom) addMom(8);
    notes.push('<p class="note good">First down!</p>');
    if (!S.wraithRally) {
      S.wraithRally = true; S.fright = true;
      notes.push('<p class="note wraith">Nobody, the Wraiths’ headless horseman, rides the sideline. Fright: your next snap window shrinks.</p>');
    }
  } else {
    S.down++; S.toGo -= out.y;
    if (S.down > 4) { endDrive('downs'); return; }
    if (S.down === 4) notes.push(`<p class="note">Fourth down. Go for it${100 - S.ball + 17 <= 55 ? ' or kick the field goal' : ''}.</p>`);
  }
  if (notes.length) addPanel(notes.join(''));
  S.phase = 'choose'; render();
}

const ENDS = {
  td: ['Touchdown!', 'Six points for the Labyrinth Bulls.'],
  fg: ['Three points', 'The Bulls settle for a field goal.'],
  fgmiss: ['Missed kick', 'Wraiths ball.'],
  to: ['Turnover', 'The Wraiths take over.'],
  downs: ['Turnover on downs', 'Stopped on fourth down.']
};
function endHTML(kind) {
  const [h, t] = ENDS[kind] || ENDS.to;
  return `<div class="end ${kind === 'td' || kind === 'fg' ? 'win' : 'loss'}"><h3>${h}</h3>` +
    `<p>${t} ${S.plays} play${S.plays === 1 ? '' : 's'}, ${S.yards} yards, ${S.perf} perfect input${S.perf === 1 ? '' : 's'}.</p>` +
    `<button class="again" id="again" type="button">Run it back</button></div>`;
}
function endDrive(kind) {
  S.over = true; S.phase = 'over'; S.result = kind;
  render(); addPanel(endHTML(kind));
  if (kind === 'td' || kind === 'fg') { burst(); buzz([30, 50, 30, 50, 60]); }
}
function reset() { S = fresh(); fx.length = 0; pops.length = 0; play = null; mode = null; tsT = 1; chargeHeld = false; setup('run', 'zone', true); render(); intro(); }

/* ================= HUD outside the field ================= */
const pct = y => `${(10 + y) / 120 * 100}%`;
function buildTicks() {
  let h = '';
  for (let y = 10; y <= 90; y += 10) h += `<i class="tick" style="left:${pct(y)}"><em>${y <= 50 ? y : 100 - y}</em></i>`;
  $('ticks').innerHTML = h;
}
const spot = b => b >= 100 ? 'End zone' : b < 50 ? `Own ${b}` : b === 50 ? 'Midfield' : `Wraiths ${100 - b}`;
function render() {
  $('downTxt').textContent = S.over ? 'Final' : `${ORD[S.down]} & ${S.ball + S.toGo >= 100 ? 'Goal' : S.toGo}`;
  $('spotTxt').textContent = spot(S.ball);
  $('momFill').style.width = S.mom + '%';
  $('momPct').textContent = Math.round(S.mom) + '%';
  $('ball').style.left = pct(S.ball); $('los').style.left = pct(S.ball);
  $('ltg').style.left = pct(Math.min(100, S.ball + S.toGo)); $('ltg').hidden = S.over;
  $('stats').textContent = `Play ${S.plays} · ${S.yards} yds`;
  const busy = S.phase !== 'choose' || S.over, list = ['run', 'short', 'deep'], fgDist = 100 - S.ball + 17;
  if (S.down === 4 && fgDist <= 55 && !S.over) list.push('fg');
  list.push('rally');
  $('cards').innerHTML = list.map(k => {
    const p = PLAYS[k]; let sub = p.sub, dis = busy, cls = 'card';
    if (k === 'rally') { const ready = S.mom >= 100; dis = busy || !ready; cls += ready ? ' rally ready' : ' rally'; if (!ready) sub = `Rally at ${Math.round(S.mom)}%`; }
    if (k === 'fg') sub = `${fgDist}-yard try`;
    return `<button class="${cls}" type="button" data-k="${k}"${dis ? ' disabled' : ''}><b>${p.name}</b><small>${sub}</small></button>`;
  }).join('');
}
$('cards').addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b && !b.disabled) runPlay(b.dataset.k); });

/* ================= boot ================= */
async function start(data) {
  if (data && data.S) { S = Object.assign(fresh(), data.S); if (S.phase === 'busy') S.phase = 'choose'; }
  buildTicks(); render();
  try { await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]); } catch (_) {}
  buildArena();
  setup('run', 'zone', true);
  cam.x = S.bx; cam.y = S.ball - 3;
  new ResizeObserver(resize).observe(stage); resize();
  if (S.over) { setTop('', ''); showPanel(''); addPanel(endHTML(S.result)); }
  else if (S.plays === 0) intro();
  else { setTop('', ''); showPanel('<p class="flavor">Back in the huddle. Pick a play.</p>'); }
  last = performance.now();
  engine.runRenderLoop(frame);
}
try { window.claude?.hot?.snapshot?.(() => ({ S })); } catch (_) {}
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
})();
</script>
