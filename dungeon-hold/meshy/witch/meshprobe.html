<!doctype html><html><body><script src="three.min.js"></script><script src="GLTFLoader.js"></script><script>
window.probe=()=>fetch('char.glb').then(r=>r.arrayBuffer()).then(buf=>new Promise((res,rej)=>new THREE.GLTFLoader().parse(buf,'',g=>{ const scene=g.scene; scene.updateMatrixWorld(true); const out=[]; scene.traverse(o=>{ if(!o.isMesh) return; const pos=o.geometry.attributes.position; const b=new THREE.Box3().setFromBufferAttribute(pos); const top={}; if(o.isSkinnedMesh){ const si=o.geometry.attributes.skinIndex, sw=o.geometry.attributes.skinWeight; const names=o.skeleton.bones.map(b=>b.name); for(let i=0;i<pos.count;i++){ const ix=[si.getX(i),si.getY(i),si.getZ(i),si.getW(i)], w=[sw.getX(i),sw.getY(i),sw.getZ(i),sw.getW(i)]; let d=0; for(let k=1;k<4;k++) if(w[k]>w[d]) d=k; const n=names[ix[d]]; top[n]=(top[n]||0)+1; } }
  out.push({name:o.name,parent:o.parent&&o.parent.name,skinned:!!o.isSkinnedMesh,verts:pos.count,tris:(o.geometry.getIndex()?o.geometry.getIndex().count:pos.count)/3,min:b.min.toArray().map(v=>+v.toFixed(2)),max:b.max.toArray().map(v=>+v.toFixed(2)),bones:Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5),scale:o.getWorldScale(new THREE.Vector3()).x.toFixed(3)}); }); res(out); },rej)));
</script></body></html>
