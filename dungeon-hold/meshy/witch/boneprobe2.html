<!doctype html><html><body><script src="three.min.js"></script><script src="GLTFLoader.js"></script><script>
window.probe=()=>fetch('witch.glb').then(r=>r.arrayBuffer()).then(buf=>new Promise((res,rej)=>new THREE.GLTFLoader().parse(buf,'',g=>{ const scene=g.scene; scene.updateMatrixWorld(true); let sk=null; scene.traverse(o=>{ if(o.isSkinnedMesh) sk=o; }); const bones=sk.skeleton.bones.map(b=>b.name); const pos=sk.geometry.attributes.position, si=sk.geometry.attributes.skinIndex, sw=sk.geometry.attributes.skinWeight; const cnt={}, far={}; const v=new THREE.Vector3(); const jp={}; sk.skeleton.bones.forEach((b,i)=>{ const m=sk.skeleton.boneInverses[i].clone().invert(); jp[b.name]=new THREE.Vector3().applyMatrix4(m); });
  for(let i=0;i<pos.count;i++){ const idx=[si.getX(i),si.getY(i),si.getZ(i),si.getW(i)], w=[sw.getX(i),sw.getY(i),sw.getZ(i),sw.getW(i)]; let d=0; for(let k=1;k<4;k++) if(w[k]>w[d]) d=k; const n=bones[idx[d]]; cnt[n]=(cnt[n]||0)+1; v.fromBufferAttribute(pos,i).applyMatrix4(sk.bindMatrix); const dd=jp[n]?v.distanceTo(jp[n]):0; if(dd>.2) far[n]=(far[n]||0)+1; if(n==='LeftHand'||n==='RightHand'){ (window.__hd=window.__hd||{})[n]=(window.__hd[n]||[]); window.__hd[n].push(+dd.toFixed(2)); } }
  const hd={}; for(const k in (window.__hd||{})){ const a=window.__hd[k].sort((x,y)=>x-y); hd[k]={n:a.length,p50:a[a.length>>1],p90:a[(a.length*.9)|0],max:a[a.length-1]}; }
  const jpo={}; for(const k in jp) jpo[k]=jp[k].toArray().map(x=>+x.toFixed(2)); res({cnt,jp:jpo,scale:sk.bindMatrix.elements[0]}); },rej)));
</script></body></html>
