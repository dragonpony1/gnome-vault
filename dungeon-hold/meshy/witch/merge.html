    const pts=[]; for(let i=0;i<pos.count;i++){ skinPos(skinned,i,v); if(v.x<hp.x-.03&&v.y>hp.y+.15) pts.push(v.clone()); }

    let cxx=0,cxy=0,cxz=0,cyy=0,cyz=0,czz=0; for(const p of pts){ const d=p.clone().sub(mean); cxx+=d.x*d.x; cxy+=d.x*d.y; cxz+=d.x*d.z; cyy+=d.y*d.y; cyz+=d.y*d.z; czz+=d.z*d.z; }
    let axis=new THREE.Vector3(0,1,0); for(let k=0;k<30;k++){ axis.set(cxx*axis.x+cxy*axis.y+cxz*axis.z,cxy*axis.x+cyy*axis.y+cyz*axis.z,cxz*axis.x+cyz*axis.y+czz*axis.z).normalize(); } if(axis.y<0) axis.negate();   // power iteration → principal direction, pointing up the blade
    const tHand=hp.clone().sub(mean).dot(axis); let tTip=-1e9; for(const p of pts){ tTip=Math.max(tTip,p.clone().sub(mean).dot(axis)); }

    const cut=new Uint8Array(pos.count); let ncut=0; for(let i=0;i<pos.count;i++){ skinPos(skinned,i,v); const rel=v.sub(base); const t=rel.dot(axis); if(t<.07||t>len+.06) continue; const r=rel.addScaledVector(axis,-t).length(); if(r<(t<.3?.15:.1)){ cut[i]=1; ncut++; } }
    const idx=g.getIndex(); const keep=[]; if(idx){ const a=idx.array; for(let i=0;i<a.length;i+=3){ if(cut[a[i]]||cut[a[i+1]]||cut[a[i+2]]) continue; keep.push(a[i],a[i+1],a[i+2]); } g.setIndex(keep); }

    mount={bone:'RightHand',pos:gripL.toArray().map(x=>+x.toFixed(3)),axis:axisL.toArray().map(x=>+x.toFixed(4)),len:+(len*100).toFixed(1),cutVerts:ncut,tris:keep.length/3,bladePts:pts.length,offset:+base.distanceTo(hp).toFixed(3)};
    // carried in the model as an empty node under the hand bone (extras on the root do not survive the exporter): its

    const mk=new THREE.Object3D(); mk.name='weaponMount_'+Math.round(len*100); mk.position.copy(gripL); mk.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),axisL); rh.add(mk); bones.length=0; scene.traverse(o=>{ if(o.isBone) bones.push(o); }); }
  const clips=[window.Idle,Walk,Run,Attack,window.Death,window.Jump]; if(shoutG&&shoutG.animations[0]){ const Shout=fix(shoutG.animations[0],'Shout'); for(const t of Shout.tracks){ if(/Hips\.position$/.test(t.name)){ const v=t.values; for(let i=0;i<v.length;i+=3){ v[i]=hipsRest.x; v[i+2]=hipsRest.z; } } } clips.push(Shout); }
  let miny=1e9,maxy=-1e9; const v=new THREE.Vector3(); scene.traverse(o=>{ if(o.isBone){ o.getWorldPosition(v); miny=Math.min(miny,v.y); maxy=Math.max(maxy,v.y); } });
  const drift=(clip)=>{ const t=clip.tracks.find(t=>/Hips\.position$/.test(t.name)); if(!t) return 0; const v=t.values, n=v.length; const d=new THREE.Vector3(v[n-3]-v[0],0,v[n-1]-v[2]); const q=hips.parent.getWorldQuaternion(new THREE.Quaternion()); d.applyQuaternion(q); const sc=hips.parent.getWorldScale(new THREE.Vector3()).x; return +(d.length()*sc/clip.duration/window.__meshH).toFixed(3); };
  const natural={walk:drift(W),run:drift(Rn)};
  return new Promise(res=>new THREE.GLTFExporter().parse(scene,buf=>{ const u=new Uint8Array(buf); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); res({b64:btoa(s),mount,yawFixDeg:Math.round(-yaw*180/PI),driftYawDeg:Math.round(Math.atan2(driftDir.x,driftDir.z)*180/PI),meshH:+window.__meshH.toFixed(3),natural,toeYawDeg:Math.round(Math.atan2(toeDir.x,toeDir.z)*180/PI),srcTex:srcSize,boneHeight:+(maxy-miny).toFixed(3),slashPeak:+bt.toFixed(2),attackWindow:[+t0.toFixed(2),+t1.toFixed(2)],clips:clips.map(c=>c.name+':'+c.duration.toFixed(2)+'s/'+c.tracks.length+'tr'),verts:skinned.geometry.attributes.position.count}); },{binary:true,animations:clips,onlyVisible:false,truncateDrawRange:false}));
};
