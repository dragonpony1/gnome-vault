<!doctype html><html><body><script src="three.min.js"></script><script src="GLTFLoader.js"></script><script>
const load=url=>fetch(url).then(r=>r.arrayBuffer()).then(buf=>new Promise((res,rej)=>new THREE.GLTFLoader().parse(buf,'',res,rej)));
window.probe=async()=>{ const g=await load('squire2.glb'); const scene=g.scene; scene.updateMatrixWorld(true); let sk=null; scene.traverse(o=>{ if(o.isSkinnedMesh) sk=o; }); sk.skeleton.update();
  const skinPos=(mesh,i,out)=>{ const gm=mesh.geometry, pos=gm.attributes.position, si=gm.attributes.skinIndex, sw=gm.attributes.skinWeight; const bm=mesh.skeleton.boneMatrices; const v=new THREE.Vector3().fromBufferAttribute(pos,i).applyMatrix4(mesh.bindMatrix); out.set(0,0,0); const idx=[si.getX(i),si.getY(i),si.getZ(i),si.getW(i)], w=[sw.getX(i),sw.getY(i),sw.getZ(i),sw.getW(i)]; const m4=new THREE.Matrix4(); for(let k=0;k<4;k++){ if(!w[k]) continue; m4.fromArray(bm,idx[k]*16); out.addScaledVector(v.clone().applyMatrix4(m4),w[k]); } return out.applyMatrix4(mesh.bindMatrixInverse).applyMatrix4(mesh.matrixWorld); };
  const bone=n=>scene.getObjectByName(n); const hand=bone('RightHand'), fore=bone('RightForeArm'); const hp=hand.getWorldPosition(new THREE.Vector3()), fp=fore.getWorldPosition(new THREE.Vector3());
  const J=n=>sk.skeleton.bones.findIndex(b=>b.name===n); const jh=J('RightHand'); const pos=sk.geometry.attributes.position, si=sk.geometry.attributes.skinIndex, sw=sk.geometry.attributes.skinWeight;
  // vertices mostly bound to the right hand: how far from the hand joint are they? (the fist is near; the sword sticks out)
  const v=new THREE.Vector3(); const dists=[]; let far=null, fd=0; const byBone={};
  for(let i=0;i<pos.count;i++){ const idx=[si.getX(i),si.getY(i),si.getZ(i),si.getW(i)], w=[sw.getX(i),sw.getY(i),sw.getZ(i),sw.getW(i)]; let wh=0, bi=0; for(let k=0;k<4;k++){ if(idx[k]===jh) wh+=w[k]; if(w[k]>w[bi]) bi=k; } skinPos(sk,i,v); const d=v.distanceTo(hp); if(wh>.5){ dists.push(+d.toFixed(2)); if(d>fd){ fd=d; far=v.clone(); } } if(d<.9){ const nm=sk.skeleton.bones[idx[bi]].name; byBone[nm]=(byBone[nm]||0)+1; } }
  dists.sort((a,b)=>a-b); const hist={}; for(const d of dists){ const b=(Math.floor(d*20)/20).toFixed(2); hist[b]=(hist[b]||0)+1; }
  const dir=far.clone().sub(hp).normalize(); const foreDir=hp.clone().sub(fp).normalize();
  // the sword: walk out along the ray from the hand through the farthest hand-bound vertex; anything within .12 of that ray
  // and beyond the fist belongs to the blade. Report its extent and which bones own it.
  const ray=far.clone().sub(hp).normalize(); const sword=[]; const tally={}; let tmax=0, tipv=null; let rad=0;
  for(let i=0;i<pos.count;i++){ skinPos(sk,i,v); const rel=v.clone().sub(hp); const t=rel.dot(ray); if(t<.06) continue; const r=rel.clone().addScaledVector(ray,-t).length(); if(r>.12) continue; const idx=[si.getX(i),si.getY(i),si.getZ(i),si.getW(i)], w=[sw.getX(i),sw.getY(i),sw.getZ(i),sw.getW(i)]; let bi=0; for(let k=1;k<4;k++) if(w[k]>w[bi]) bi=k; const nm=sk.skeleton.bones[idx[bi]].name; tally[nm]=(tally[nm]||0)+1; sword.push(i); if(t>tmax){ tmax=t; tipv=v.clone(); } rad=Math.max(rad,r); }
  // also: how many verts are within .12 of the ray but BEHIND the fist (t<.06) — the fist itself
  // where is the blade really? bucket every vertex on the character's right beyond the shoulder line by height
  const buckets={}; let minx=0; for(let i=0;i<pos.count;i++){ skinPos(sk,i,v); if(v.x>-0.45) continue; minx=Math.min(minx,v.x); const idx=[si.getX(i),si.getY(i),si.getZ(i),si.getW(i)], w=[sw.getX(i),sw.getY(i),sw.getZ(i),sw.getW(i)]; let bi=0; for(let k=1;k<4;k++) if(w[k]>w[bi]) bi=k; const nm=sk.skeleton.bones[idx[bi]].name; const b=(Math.floor(v.y*10)/10).toFixed(1); (buckets[b]=buckets[b]||{n:0,bones:{},xmin:9,xmax:-9,zmin:9,zmax:-9}); const B=buckets[b]; B.n++; B.bones[nm]=(B.bones[nm]||0)+1; B.xmin=Math.min(B.xmin,v.x); B.xmax=Math.max(B.xmax,v.x); B.zmin=Math.min(B.zmin,v.z); B.zmax=Math.max(B.zmax,v.z); }
  const rows=Object.keys(buckets).sort((a,b)=>+a-+b).map(k=>{ const B=buckets[k]; return k+': n='+B.n+' x['+B.xmin.toFixed(2)+','+B.xmax.toFixed(2)+'] z['+B.zmin.toFixed(2)+','+B.zmax.toFixed(2)+'] '+Object.entries(B.bones).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]+':'+e[1]).join(' '); });
  return {rightSide:rows,minx:+minx.toFixed(3),swordVerts:sword.length,swordLen:+tmax.toFixed(3),swordTip:tipv&&tipv.toArray().map(x=>+x.toFixed(3)),swordBones:tally,maxR:+rad.toFixed(3),ray:ray.toArray().map(x=>+x.toFixed(3)),hand:hp.toArray().map(x=>+x.toFixed(3)),handVerts:dists.length,tipDist:+fd.toFixed(3),tip:far.toArray().map(x=>+x.toFixed(3)),bladeDir:dir.toArray().map(x=>+x.toFixed(3)),foreDir:foreDir.toArray().map(x=>+x.toFixed(3)),hist,nearHandByBone:byBone,handLocalTip:hand.worldToLocal(far.clone()).toArray().map(x=>+x.toFixed(2))}; };
</script></body></html>
